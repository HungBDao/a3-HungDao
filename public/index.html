<!doctype html>
<html lang='en'>
  <head>
    <title>Task Deadline Tracker — Log In</title>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='description' content='Log in or create an account for the Task Deadline Tracker.' />

    <link rel='preconnect' href='https://fonts.googleapis.com' />
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap' rel='stylesheet' />

    <!-- CSS framework: Bootstrap 5 -->
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel='stylesheet' href='css/main.css' />

    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <main class='login-wrapper'>
      <div class='card login-card shadow-sm'>
        <h1 class='h3 mb-1'>Task Deadline Tracker</h1>
        <p class='text-muted mb-4'>Log in to see your tasks. New username? We'll create an account for you.</p>

        <form id='login-form' novalidate>
          <div class='mb-3'>
            <label for='username' class='form-label'>Username</label>
            <input type='text' class='form-control' id='username' name='username' autocomplete='username' required />
          </div>

          <div class='mb-3'>
            <label for='password' class='form-label'>Password</label>
            <input type='password' class='form-control' id='password' name='password' autocomplete='current-password' required minlength='4' />
          </div>

          <div id='login-error' class='alert alert-danger d-none' role='alert'></div>

          <button type='submit' class='btn btn-primary w-100'>Log In / Sign Up</button>
        </form>
      </div>
    </main>

    <script src='js/login.js' defer></script>
  </body>
</html>
